<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسابقة السيرة النبوية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#070f0c;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#0e1f18;border:2px solid #e8c477;border-radius:20px;padding:40px;max-width:400px;width:100%;text-align:center}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #24473b;background:#0b1811;color:#fff;font-size:16px}
button{width:100%;padding:14px;background:#e8c477;color:#152016;border:0;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer}
button:hover{transform:scale(1.02)}
h1{color:#e8c477}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#122a20;border:1px solid #e8c477;padding:12px 24px;border-radius:10px;display:none}
</style>
</head>
<body>
<div class="box">
  <h1>🕌 مسابقة السيرة</h1>
  <p>أدخل بياناتك للدخول</p>
  <input id="name" placeholder="الاسم">
  <input id="age" type="number" placeholder="العمر">
  <select id="country">
    <option value="">اختر دولتك</option>
    <option value="DZ">🇩🇿 الجزائر</option>
    <option value="SA">🇸🇦 السعودية</option>
    <option value="EG">🇪🇬 مصر</option>
    <option value="MA">🇲🇦 المغرب</option>
    <option value="TN">🇹🇳 تونس</option>
  </select>
  <button onclick="login()">دخول 🚀</button>
  <p style="font-size:12px;color:#93a89c;margin-top:10px">بياناتك تحفظ محلياً وفي السحابة</p>
</div>
<div id="toast" class="toast"></div>

<script>
const supabaseUrl = 'https://qdgbzmbpqsrvdivqblft.supabase.co';
const supabaseKey = 'sb_publishable_wfpPsmIUF6Q5DDCuzP95UA_3-uGk2JN';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

async function login() {
  const name = document.getElementById('name').value.trim();
  const age = parseInt(document.getElementById('age').value);
  const country = document.getElementById('country').value;
  
  if(!name || name.length < 2) {
    toast('⚠️ أدخل اسم صحيح');
    return;
  }
  if(!age || age < 6 || age > 120) {
    toast('⚠️ أدخل عمر صحيح');
    return;
  }
  
  // حفظ محلياً
  const profile = { name, age, country, xp: 0, games: 0, correctPct: null, bestStreak: 0, badges: [] };
  localStorage.setItem('sira_profile', JSON.stringify(profile));
  
  // حفظ في Supabase (حتى لو فشل)
  try {
    await supabase.from('players').upsert({
      name, age, country: country || '', xp: 0, games: 0, correct_pct: null, best_streak: 0, badges: []
    });
  } catch(e) {
    console.log('Supabase save failed but local works');
  }
  
  toast('✅ مرحباً بك ' + name + '!');
  
  // تحويل للصفحة الرئيسية
  document.querySelector('.box').innerHTML = `
    <h1>✅ تم الدخول بنجاح!</h1>
    <p style="color:#93a89c">مرحباً بك ${name} (${age} سنة)</p>
    <p style="color:#e8c477;font-size:14px">تم حفظ بياناتك في السحابة ☁️</p>
    <button onclick="location.reload()">العب الآن 🎮</button>
  `;
}
</script>
</body>
</html>
